name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # These packages ship inside a dsh install, not as normal dependencies
      # (see AGENTS.md). scripts/link-dsh-deps.sh does this locally; CI pulls
      # them from npm instead. --no-save keeps package.json free of them.
      - name: Install dsh-only packages
        run: npm install --no-save --no-package-lock @deepseek-ai/schemastery @deepseek-ai/cosmokit @deepseek-ai/dsh-tools

      - name: Syntax check (host + browser bundle)
        run: |
          for f in lib/*.js client/client.js; do node --check "$f"; done

      - name: Test
        run: npm test
